[project]
name = "pr-agent"
version = "0.1.0"
description = "Agentic PR review & autofix with LangGraph and LangSmith"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.6",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-anthropic>=0.3",
  "langsmith>=0.4",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "pathspec>=0.12",
  "unidiff>=0.7",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  # analyzers invoked as subprocesses (LocalSandbox uses these; Docker image pins its own)
  "ruff>=0.6",
  "bandit>=1.7",
  "semgrep>=1.80",
  "pytest>=8.0",
]

[project.scripts]
pr-agent = "pr_agent.cli:app"

[dependency-groups]
dev = ["mypy>=1.10", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["demo", "src/pr_agent/analyzers/semgrep_rules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
packages = ["pr_agent"]
mypy_path = "src"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
